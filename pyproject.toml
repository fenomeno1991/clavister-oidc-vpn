[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clavister-oidc-vpn"
version = "0.1.0"
description = "Clavister OneConnect VPN OIDC client for Linux with Entra ID support"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
clavister-vpn = "clavister_vpn.cli:main"